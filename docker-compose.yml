version: '3.8'

services:
  backend:
    build: ./backend
    container_name: resume_screener_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    depends_on:
      chromadb:
        condition: service_healthy # Wait for ChromaDB to be healthy
    networks:
      - resume_network

  frontend:
    build: ./frontend
    container_name: resume_screener_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - resume_network

  chromadb:
    image: chromadb/chroma
    container_name: resume_screener_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - resume_network

networks:
  resume_network:
    driver: bridge

volumes:
  chroma_data: